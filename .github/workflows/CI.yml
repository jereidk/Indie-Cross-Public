# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Manual only -- run from the Actions tab when you actually want a build,
  # not automatically on every push/PR.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          # Caches the extracted NDK (actions/cache under the hood) so it
          # isn't re-downloaded/re-extracted on every run.
          local-cache: true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # android-actions/setup-android@v3's own sdkmanager (cmdline-tools
          # 16.0) refuses to run at all below JDK 17 ("This tool requires JDK
          # 17 or later") -- JDK 11 was this workflow's original 2021-era
          # pin, no longer viable just to get past SDK setup. 17 also matches
          # NightmareVision-Android-Support's proven-working config for this
          # exact Lime/Haxe/Flixel/Android stack.
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          # Matches NightmareVision-Android-Support's proven-working pin for
          # this exact Lime/Haxe/Flixel/Android stack.
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-android-port-${{ hashFiles('.hxpkg') }}

      # hxpkg reads .hxpkg and installs everything in one pass -- replaces
      # the old per-library haxelib install/git calls (each with its own
      # progress spam) with one compact install log. flixel/flixel-addons/
      # openfl/lime/hxcpp are pinned in .hxpkg to FunkinCrew's forks (same
      # commits NightmareVision-Android-Support uses) instead of stock
      # HaxeFlixel -- unpinned "latest" stock Flixel (6.2.0) had diverged
      # far enough from what this codebase targets (FlxAnimationController/
      # FlxCamera/tween API) to fail the build outright.
      - name: Install Haxelib (via hxpkg)
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib setup ~/haxelib
          haxelib install hxpkg --quiet
          haxelib run hxpkg install --quiet
          haxelib list

      # Lime pinned to FunkinCrew's git fork (see .hxpkg) doesn't ship the
      # prebuilt lime.ndll that haxelib's zip releases include -- it has to
      # be compiled locally, or "lime setup"/any lime command fails with
      # "Could not load lime.ndll". Self-healing (checks the file first,
      # only rebuilds when actually missing) instead of gating strictly on
      # cache-hit, matching NightmareVision-Android-Support's own workaround
      # for this exact fork.
      - name: Wrap g++-13 to force C++23
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      - name: Rebuild Linux Lime ndll
        timeout-minutes: 15
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -euo pipefail
          if [ -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "lime.ndll already present, skipping rebuild."
          else
            echo "lime.ndll missing -- rebuilding from source."
            haxelib run lime rebuild cpp -release
            if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
              echo "ERROR: Missing Lime ndll after rebuild"
              exit 1
            fi
          fi

      - name: Setup Lime for Flixel
        run: haxelib --quiet --always run lime setup flixel

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Compile
        run: haxelib run lime build android --app-version="4.0.0-${{ github.run_id}}"

      - name: Publish Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: androidBuild
          path: export/release/android/bin/app/build/outputs/apk/debug
