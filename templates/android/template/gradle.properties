# Project-wide Gradle settings.
#
# This overrides Lime's own default templates/android/template/gradle.properties
# (FunkinCrew/lime, pinned commit 6421de16b9dfa4fb55c19f12db65d392a57585c8) --
# every line below is Lime's stock content verbatim, with two additions
# (org.gradle.caching, a larger org.gradle.jvmargs heap) folded directly into
# it instead of being sed-patched onto Lime's own shared checkout at CI time
# the way ndk.abiFilters/the symbol-extraction task still are. Committing this
# as a real template file means Gradle's own settings never depend on which
# CI step ran last or in what order, unlike the build.gradle-side patches.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process. Lime's own default
# is -Xmx4608m; bumped further and enabled the build cache since CI runners
# have room for it and Gradle's dexing/packaging phase benefits from both.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.caching=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

VERSION_NAME=::META_VERSION::
VERSION_CODE=::META_BUILD_NUMBER::

ANDROID_BUILD_TARGET_SDK_VERSION=::ANDROID_TARGET_SDK_VERSION::
ANDROID_BUILD_MIN_SDK_VERSION=::ANDROID_MINIMUM_SDK_VERSION::
ANDROID_BUILD_SDK_VERSION=::ANDROID_TARGET_SDK_VERSION::
ANDROID_BUILD_TOOLS_VERSION=::ANDROID_BUILD_TOOLS_VERSION::
::if (ANDROID_TARGET_SDK_VERSION>=28)::
android.useAndroidX=::ANDROID_USE_ANDROIDX::
android.enableJetifier=::ANDROID_ENABLE_JETIFIER::
::end::
::if KEY_STORE::
KEY_STORE=::KEY_STORE::
KEY_STORE_PASSWORD=::KEY_STORE_PASSWORD::
KEY_STORE_ALIAS=::KEY_STORE_ALIAS::
KEY_STORE_ALIAS_PASSWORD=::KEY_STORE_ALIAS_PASSWORD::
::end::
::foreach ANDROID_GRADLE_PROPERTIES::::if ((value != null) && (value != ""))::::key::=::value::
::end::::end::
